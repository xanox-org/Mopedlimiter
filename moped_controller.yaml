esphome:
  name: moped-controller
  friendly_name: Moped Speed Limiter

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 2
      fast_connect: true
    - ssid: !secret wifi_ssid_garage
      password: !secret wifi_password_garage
      priority: 1
      fast_connect: true
  ap:
    ssid: "MopedLimiter Setup"
    password: "moped1234"

captive_portal:

web_server:
  port: 80

logger:

ota:

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO3
  miso_pin: GPIO10

rc522_spi:
  cs_pin: GPIO5
  reset_pin: GPIO6
  id: moped_rfid
  on_tag:
    then:
      - lambda: |-
          std::string scanned_uid = tag.uid;
          auto *globals = id(authorized_uids);
          bool authorized = false;
          for (auto &uid : globals->value) {
            if (uid == scanned_uid) {
              authorized = true;
              break;
            }
          }
          if (authorized) {
            // Toggle limiter switch
            id(limiter_switch).toggle();
          } else {
            // Publish last scanned tag
            id(last_scanned_tag).publish_state(scanned_uid.c_str());
          }

globals:
  - id: authorized_uids
    type: std::vector<std::string>
    restore_value: yes
    initial_value: '[]'

output:
  - platform: gpio
    pin: GPIO7
    id: limiter_output

switch:
  - platform: template
    name: "Limiter Switch"
    id: limiter_switch
    turn_on_action:
      - output.turn_on: limiter_output
    turn_off_action:
      - output.turn_off: limiter_output
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    name: "Last Scanned Tag"
    id: last_scanned_tag
    icon: "mdi:tag"
  - platform: template
    name: "Authorized Tags List"
    id: authorized_tags_list
    icon: "mdi:tag-multiple"

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Update the Authorized Tags List sensor
          std::string tags = "";
          for (auto &uid : id(authorized_uids).value) {
            tags += uid + ", ";
          }
          if (!tags.empty()) tags.pop_back(), tags.pop_back();
          id(authorized_tags_list).publish_state(tags.c_str());

api:
  services:
    - service: add_tag
      variables:
        uid: string
      then:
        - lambda: |-
            auto &uids = id(authorized_uids).value;
            if (std::find(uids.begin(), uids.end(), uid) == uids.end()) {
              uids.push_back(uid);
              id(authorized_uids).value = uids;
            }
    - service: delete_tag
      variables:
        uid: string
      then:
        - lambda: |-
            auto &uids = id(authorized_uids).value;
            uids.erase(std::remove(uids.begin(), uids.end(), uid), uids.end());
            id(authorized_uids).value = uids;
